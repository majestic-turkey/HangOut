services:
  hangout:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/hangman.db
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:3001:3001"
    labels:
      homepage.enable: "true"
      homepage.url: "https://hangout.thesaltworks.io"
      homepage.title: "HangOut"
      homepage.description: "Multiplayer hangman"
      homepage.icon: "🪢"
